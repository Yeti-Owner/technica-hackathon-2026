<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Image Lab · Nod</title>
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="ai_mark.css">

  <script>
    (function() {
      try {
        const saved = localStorage.getItem('nod-theme');
        if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {}
    })();
  </script>

  <style>
    /* ===================================================================
       TWEAKABLE LAB PAGE VARIABLES
       =================================================================== */
    :root {
      --lab-card-min-width: 240px;
      --lab-card-aspect-ratio: 4 / 3;
      --lab-card-max-height: 280px;
      --lab-grid-gap: clamp(24px, 2.5vw, 32px);
      
      --ai-frame-thickness: 18px;
      --ai-frame-bump-scale: 1;
      --ai-frame-bg: #ffffff;
      --ai-frame-shadow: 0 14px 28px rgba(14, 52, 85, 0.16);
      
      --ai-badge-bg: #ffffff;
      --ai-badge-color: #0a0a0a;
      --ai-badge-font-size: 0.8rem;
      
      --ai-float-distance: 3px;
      --ai-float-duration: 5s;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      background: var(--bg-hero);
      color: var(--text-main);
      font-family: var(--font-body);
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* ── Ambient Decorative Clouds (Aria-Hidden, Behind Content) ── */
    .lab-sky-clouds {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .lab-cloud {
      position: absolute;
      opacity: 0.72;
      filter: blur(0.5px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .lab-cloud img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
    }

    .lab-cloud-tl {
      top: -40px;
      left: -60px;
      width: clamp(260px, 28vw, 420px);
      animation: ambientDrift 22s ease-in-out infinite alternate;
    }

    .lab-cloud-tr {
      top: 40px;
      right: -80px;
      width: clamp(280px, 32vw, 460px);
      animation: ambientDrift 26s ease-in-out infinite alternate-reverse;
    }

    .lab-cloud-br {
      bottom: -60px;
      right: -50px;
      width: clamp(300px, 35vw, 500px);
      opacity: 0.6;
    }

    :root[data-theme="dark"] .lab-cloud {
      opacity: 0.35;
      filter: brightness(0.65) contrast(1.2) drop-shadow(0 0 40px rgba(70, 130, 200, 0.2));
    }

    @keyframes ambientDrift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(16px, 12px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .lab-cloud { animation: none !important; }
    }

    /* ── Lab Header & Nav ─────────────────────────────────────────── */
    .lab-header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 5vw;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .lab-header-inner {
      max-width: 1360px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .lab-nav-links {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* ── Main Layout ──────────────────────────────────────────────── */
    .lab-main {
      position: relative;
      z-index: 10;
      flex-grow: 1;
      padding: 30px 5vw 80px;
      max-width: 1360px;
      margin: 0 auto;
      width: 100%;
    }

    .lab-intro {
      margin-bottom: 40px;
    }

    .lab-eyebrow {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .lab-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 3.8vw, 3.2rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.025em;
      color: var(--hero-title-color);
      margin: 0 0 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 12px;
    }

    .lab-title-sub {
      font-size: clamp(0.95rem, 1.4vw, 1.15rem);
      font-weight: 500;
      color: var(--text-subtle);
      font-family: var(--font-body);
      letter-spacing: normal;
    }

    /* Styled soft debug intro line */
    .lab-intro-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 20px;
      padding: 18px 24px;
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      max-width: 820px;
    }

    .lab-intro-card .hint {
      margin: 0;
      font-size: 0.96rem;
      line-height: 1.6;
      color: var(--text-main);
    }

    /* ── Responsive Picture Grid ──────────────────────────────────── */
    .lab-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--lab-grid-gap);
      margin-top: 36px;
    }

    @media (max-width: 1199px) {
      .lab-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 899px) {
      .lab-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 599px) {
      .lab-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    /* ── Picture Card ─────────────────────────────────────────────── */
    .lab-card {
      min-width: 0;
      width: 100%;
      box-sizing: border-box;
      margin: 0;
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      outline: none;
      transition: transform 0.25s ease;
    }

    .lab-card:hover {
      transform: translateY(-4px);
    }

    .lab-card:focus-visible {
      outline: 3px solid var(--focus-ring, #081c28);
      outline-offset: 6px;
      border-radius: 24px;
    }

    /* Non-AI Card: clean, thin soft frame */
    .cloud-frame-wrap {
      position: relative;
      background: var(--card-bg, rgba(255, 255, 255, 0.75));
      border: 1.5px solid var(--card-border, rgba(255, 255, 255, 0.9));
      border-radius: 22px;
      padding: 10px;
      box-shadow: 0 8px 22px rgba(14, 52, 85, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }

    /* Image Window */
    .img-window {
      position: relative;
      z-index: 2;
      width: 100%;
      aspect-ratio: var(--lab-card-aspect-ratio);
      max-height: var(--lab-card-max-height);
      overflow: hidden;
      border-radius: 14px;
      background: rgba(140, 180, 210, 0.25);
    }

    .img-window img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .lab-card:hover .img-window img {
      transform: scale(1.03);
    }

    /* Card Metadata Caption */
    .lab-card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 0 4px;
      font-size: 0.8rem;
      color: var(--text-subtle);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta-idx {
      font-weight: 800;
      color: var(--hero-title-color);
      background: rgba(0, 0, 0, 0.06);
      padding: 2px 7px;
      border-radius: 6px;
    }

    :root[data-theme="dark"] .meta-idx {
      background: rgba(255, 255, 255, 0.1);
    }

    .meta-host {
      font-weight: 600;
      color: var(--text-main);
    }

    .meta-file {
      opacity: 0.75;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===================================================================
       AI-DETECTED WHITE CLOUD FRAME & BLACK BADGE
       =================================================================== */
    .is-ai-card .cloud-frame-wrap {
      background: var(--ai-frame-bg, #ffffff);
      border: none;
      padding: var(--ai-frame-thickness, 18px);
      border-radius: 28px;
      filter: var(--ai-frame-shadow);
      animation: aiCardFloat var(--ai-float-duration, 5s) ease-in-out infinite alternate;
      animation-delay: var(--float-delay, 0s);
    }

    :root[data-theme="dark"] .is-ai-card .cloud-frame-wrap {
      filter: drop-shadow(0 8px 30px rgba(255, 255, 255, 0.22)) drop-shadow(0 14px 28px rgba(0, 0, 0, 0.5));
    }


    @keyframes aiCardFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(calc(-1 * var(--ai-float-distance, 3px))); }
    }

    @media (prefers-reduced-motion: reduce) {
      .is-ai-card .cloud-frame-wrap {
        animation: none !important;
      }
    }

    /* ── Lightbox Modal (Full-Size Enlarged View) ────────────────── */
    .lightbox-dialog {
      margin: auto;
      padding: 0;
      border: none;
      background: transparent;
      max-width: 95vw;
      max-height: 95vh;
      overflow: visible;
      outline: none;
    }

    .lightbox-dialog::backdrop {
      background: rgba(8, 28, 45, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    :root[data-theme="dark"] .lightbox-dialog::backdrop {
      background: rgba(2, 8, 16, 0.85);
    }

    .lightbox-content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }

    .lightbox-close-btn {
      align-self: flex-end;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.9);
      color: #081c28;
      border: 1.5px solid rgba(0, 0, 0, 0.08);
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      transition: all 0.2s ease;
    }

    .lightbox-close-btn:hover {
      background: #ffffff;
      transform: scale(1.04);
    }

    .lightbox-close-btn:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 3px;
    }

    .lightbox-media-wrap {
      position: relative;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      max-width: min(88vw, 860px);
      max-height: 72vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-media-wrap.is-ai {
      background: #ffffff;
      padding: 22px;
      filter: drop-shadow(0 20px 50px rgba(14, 52, 85, 0.25));
    }

    :root[data-theme="dark"] .lightbox-media-wrap.is-ai {
      filter: drop-shadow(0 10px 40px rgba(255, 255, 255, 0.3)) drop-shadow(0 24px 60px rgba(0, 0, 0, 0.7));
    }

    .lightbox-media-wrap img {
      display: block;
      max-width: 100%;
      max-height: calc(72vh - 44px);
      object-fit: contain;
      border-radius: 14px;
    }

    .lightbox-caption {
      margin-top: 14px;
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 600;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .lightbox-media-wrap.is-ai .ai-cloud-badge {
      display: inline-flex;
    }
  </style>
</head>
<body>

<a href="#main-content" class="skip-link">Skip to main content</a>

<!-- ═══ CELESTIAL SUN & MOON (TOP-LEFT CORNER) ═══ -->
<div class="celestial-container" aria-hidden="true">

</div>

<!-- ═══ AMBIENT SKY CLOUDS ═══ -->
<div class="lab-sky-clouds" aria-hidden="true">

    <img src="assets/clouds/cloud-new-1.png" alt="" width="420" height="260" loading="lazy">

  <div class="lab-cloud lab-cloud-tr">

    <img src="assets/clouds/cloud-new-1.png" alt="" width="500" height="300" loading="lazy">
  </div>
</div>

<!-- ═══ STICKY CLOUD NAVBAR ═══ -->
<header class="lab-header" role="banner">
  <div class="lab-header-inner">
    <nav class="lab-nav-links" aria-label="Page navigation">
      <!-- Return Home Cloud Button -->
      <a href="home.html" class="nav-cloud-link">

        <span class="nav-cloud-bg" aria-hidden="true">
          <svg class="nav-cloud-svg" viewBox="0 0 160 52" preserveAspectRatio="none" focusable="false" aria-hidden="true">
            <defs>
              <linearGradient id="gradNavThemeLab" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="var(--nav-cloud-fill-top)"/>
                <stop offset="55%" stop-color="var(--nav-cloud-fill-mid)"/>

            </defs>
            <path class="nav-cloud-path" fill="url(#gradNavThemeLab)" d="M 20 25 C 6 14, 4 34, 4 37 C 4 45, 14 48, 24 47 C 60 49, 100 48, 136 47 C 148 47, 156 40, 156 33 C 156 24, 146 16, 136 20 C 124 6, 98 4, 84 12 C 70 5, 48 7, 38 15 C 28 12, 22 18, 20 25 Z" />
          </svg>

<!-- ═══ MAIN CONTENT ═══ -->
<main id="main-content" class="lab-main">
  <div class="lab-intro">
    <span class="lab-eyebrow">Detection & Verification Lab</span>
    <h1 class="lab-title">AI image lab — debug page for the AI image checker</h1>

    <div class="lab-intro-card">
      <p class="hint">Debug lab: the card list is generated from test_images.txt at browser start. Scroll slowly and watch which images get a white cloud frame.</p>

  <section class="lab-grid" id="lab-grid" aria-label="Picture detection grid"></section>

<!-- ═══ ACCESSIBLE LIGHTBOX MODAL ═══ -->
<dialog id="lightbox-dialog" class="lightbox-dialog" aria-modal="true" aria-labelledby="lightbox-caption">
  <div class="lightbox-content">
    <button type="button" class="lightbox-close-btn" id="lightbox-close" aria-label="Close enlarged picture view">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
      <span>Close</span>
    </button>
    <div class="lightbox-media-wrap" id="lightbox-media-wrap">
      <div class="cloud-bumps-container" id="lightbox-bumps" aria-hidden="true">
        <span class="bump bump-top-1"></span>
        <span class="bump bump-top-2"></span>
        <span class="bump bump-top-3"></span>
        <span class="bump bump-bottom-1"></span>
        <span class="bump bump-bottom-2"></span>
        <span class="bump bump-bottom-3"></span>
        <span class="bump bump-left-1"></span>
        <span class="bump bump-right-1"></span>
      </div>
      <img id="lightbox-img" src="" alt="Enlarged view">
      <div class="ai-cloud-badge" id="lightbox-badge" role="status">AI GENERATED</div>
    </div>
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>
</dialog>

<script src="../artifacts/lab-urls.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  // 1. Theme Toggle Controller
  const themeBtn = document.getElementById('theme');
  if (themeBtn) {
    const isDark = document.documentElement.dataset.theme === 'dark';
    themeBtn.setAttribute('aria-pressed', String(isDark));
    const txt = themeBtn.querySelector('.nav-cloud-text');
    if (txt) txt.textContent = isDark ? 'Light theme' : 'Dark theme';

    themeBtn.addEventListener('click', function () {
      const nextDark = document.documentElement.dataset.theme !== 'dark';
      document.documentElement.dataset.theme = nextDark ? 'dark' : 'light';
      try {
        localStorage.setItem('nod-theme', nextDark ? 'dark' : 'light');
      } catch (e) {}
      themeBtn.setAttribute('aria-pressed', String(nextDark));
      if (txt) txt.textContent = nextDark ? 'Light theme' : 'Dark theme';
    });
  }

  // 2. Lightbox Controller
  const dialog = document.getElementById('lightbox-dialog');
  const closeBtn = document.getElementById('lightbox-close');
  const lbImg = document.getElementById('lightbox-img');
  const lbWrap = document.getElementById('lightbox-media-wrap');
  const lbCaption = document.getElementById('lightbox-caption');
  const lbBadge = document.getElementById('lightbox-badge');
  let lastActiveElement = null;

  function openLightbox(url, index, host, file, card) {
    lastActiveElement = card;
    lbImg.src = url;
    lbImg.alt = 'Enlarged test image ' + index;
    lbCaption.textContent = '#' + index + ' — ' + host + ' — ' + file;
    
    // Propagate AI verdict state to lightbox
    const isAi = card.classList.contains('is-ai-card');
    if (isAi) {
      lbWrap.classList.add('is-ai');
      const score = card.dataset.aiScore || '';
      lbBadge.textContent = score ? `AI GENERATED · ${score}` : 'AI GENERATED';
    } else {
      lbWrap.classList.remove('is-ai');
    }

    dialog.showModal();
    closeBtn.focus();
  }

  function closeLightbox() {
    dialog.close();
    lbImg.src = '';
    if (lastActiveElement && typeof lastActiveElement.focus === 'function') {
      lastActiveElement.focus();
    }
  }

  closeBtn.addEventListener('click', closeLightbox);
  dialog.addEventListener('click', function (e) {
    if (e.target === dialog) closeLightbox();
  });
  dialog.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      e.preventDefault();
      closeLightbox();
    }
  });

  // 3. Grid Generation
  const grid = document.getElementById('lab-grid');
  const urls = window.LAB_URLS || [];
  if (!urls.length) {
    const empty = document.createElement('div');
    empty.className = 'lab-intro-card';
    empty.innerHTML = '<p class="hint">No test images yet — add URLs to test_images.txt and restart the browser.</p>';
    grid.replaceWith(empty);
    return;
  }

  urls.forEach(function (url, i) {
    grid.append(makeCard(url, i + 1));
  });

  function makeCard(url, index) {
    const card = document.createElement('figure');
    card.className = 'lab-card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-haspopup', 'dialog');
    card.setAttribute('aria-label', `Test image ${index}. Click or press Enter to view enlarged.`);

    let host = '', file = '';
    try {
      const parsed = new URL(url);
      host = parsed.hostname;
      file = parsed.pathname.split('/').filter(Boolean).pop() || '';
    } catch (e) {}

    // Cloud Frame Wrapper
    const frameWrap = document.createElement('div');
    frameWrap.className = 'cloud-frame-wrap';

    // Decorative Cloud Bumps (aria-hidden)
    const bumps = document.createElement('div');
    bumps.className = 'cloud-bumps-container';
    bumps.setAttribute('aria-hidden', 'true');
    bumps.innerHTML = `
      <span class="bump bump-top-1"></span>
      <span class="bump bump-top-2"></span>
      <span class="bump bump-top-3"></span>
      <span class="bump bump-bottom-1"></span>
      <span class="bump bump-bottom-2"></span>
      <span class="bump bump-bottom-3"></span>
      <span class="bump bump-left-1"></span>
      <span class="bump bump-right-1"></span>
    `;

    // Image window
    const imgWindow = document.createElement('div');
    imgWindow.className = 'img-window';

    const img = document.createElement('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    img.src = url;
    img.alt = 'Test image ' + index;
    imgWindow.appendChild(img);

    // AI Badge
    const badge = document.createElement('div');
    badge.className = 'ai-cloud-badge';
    badge.setAttribute('role', 'status');
    badge.textContent = 'AI GENERATED';

    frameWrap.appendChild(bumps);
    frameWrap.appendChild(imgWindow);
    frameWrap.appendChild(badge);

    // Metadata caption
    const meta = document.createElement('figcaption');
    meta.className = 'lab-card-meta';
    meta.innerHTML = `<span class="meta-idx">#${index}</span> <span class="meta-host">${host}</span> <span class="meta-file">${file}</span>`;

    card.appendChild(frameWrap);
    card.appendChild(meta);

    // Float stagger
    card.style.setProperty('--float-delay', `${(index * 0.45) % 3.5}s`);

    // Interactive Handlers
    card.addEventListener('click', function () {
      openLightbox(url, index, host, file, card);
    });

    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openLightbox(url, index, host, file, card);
      }
    });

    return card;
  }
});
</script>
</body>
</html>
