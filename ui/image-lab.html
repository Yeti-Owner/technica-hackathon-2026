<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI image lab</title><link rel="stylesheet" href="theme.css"><style>
.lab-title { font-size:clamp(28px,4vw,40px); margin-bottom:12px; }
.lab-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:24px; margin-top:32px; }
.lab-card { min-height:220px; margin:0; border-top:3px solid var(--line); padding:16px 0; }
.lab-full { grid-column:1 / -1; }
.lab-card img { display:block; width:100%; min-height:220px; object-fit:contain; background:#111; }
.lab-card figcaption { margin-top:10px; color:var(--muted); font-size:14px; }
@media(max-width:600px) { .lab-grid { grid-template-columns:1fr; } }
</style></head>
<body><header><a href="home.html">Home</a></header><main>
<h1 class="lab-title">AI image lab — debug page for the AI image checker</h1>
<p class="hint">Debug lab: the card list is generated from test_images.txt at browser start. Scroll slowly and watch which images get a red AI banner.</p>
<section class="lab-grid" id="lab-grid"></section>
</main>
<script src="../artifacts/lab-urls.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var grid = document.getElementById('lab-grid');
  var urls = window.LAB_URLS || [];
  if (!urls.length) {
    var empty = document.createElement('p');
    empty.className = 'hint';
    empty.textContent = 'No test images yet — add URLs to test_images.txt and restart the browser.';
    grid.replaceWith(empty);
    return;
  }
  var cursor = 0, step = 0;
  while (cursor < urls.length) {
    var full = step % 2 === 1;
    var take = full ? 1 : 2;
    for (var i = 0; i < take && cursor < urls.length; i++, cursor++) {
      grid.append(makeCard(urls[cursor], cursor + 1, full));
    }
    step++;
  }
});
function makeCard(url, index, full) {
  var figure = document.createElement('figure');
  figure.className = full ? 'lab-card lab-full' : 'lab-card';
  var img = document.createElement('img');
  img.loading = 'lazy';
  img.src = url;
  img.alt = 'Test image ' + index;
  img.style.cssText = 'width:100%; min-height:220px; object-fit:contain; background:#111';
  var caption = document.createElement('figcaption');
  var host = '', file = '';
  try {
    var parsed = new URL(url);
    host = parsed.hostname;
    file = parsed.pathname.split('/').filter(Boolean).pop() || '';
  } catch (error) {}
  caption.textContent = '#' + index + ' — ' + host + ' — ' + file;
  figure.append(img, caption);
  return figure;
}
</script>
</body></html>
