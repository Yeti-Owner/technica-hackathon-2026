<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root {
  --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body:    'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --sky-top:          #48c6ef;
  --sky-base:         #6f86d6;
  --sky-bottom:       #a1c4fd;

  --text-main:        #061a28;
  --text-muted:       #375d73;

  /* Nav Cloud Tokens (Light Theme) */
  --nav-cloud-fill-top:       #ffffff;
  --nav-cloud-fill-mid:       #f3f9fd;
  --nav-cloud-fill-bottom:    #dcebf8;
  --nav-cloud-stroke:         rgba(255, 255, 255, 0.95);
  --nav-cloud-shadow:         drop-shadow(0 10px 20px rgba(8, 48, 72, 0.14)) drop-shadow(0 2px 6px rgba(8, 48, 72, 0.06));
  --nav-cloud-hover-shadow:   drop-shadow(0 14px 26px rgba(8, 48, 72, 0.20)) drop-shadow(0 4px 10px rgba(8, 48, 72, 0.08));
  --nav-cloud-focus-stroke:   #0284c7;
  --nav-cloud-focus-shadow:   drop-shadow(0 0 12px rgba(2, 132, 199, 0.55)) drop-shadow(0 10px 20px rgba(8, 48, 72, 0.16));
  --nav-cloud-active-dot:     #0284c7;
  --nav-text:                 #082032;

  /* Celestial Sun & Moon */
  --celestial-position:       absolute;
  --celestial-swap-duration:  0.8s;
  --sun-glow:                 drop-shadow(0 0 25px rgba(255, 198, 55, 0.65)) drop-shadow(0 0 55px rgba(255, 160, 0, 0.35));
  --moon-glow:                drop-shadow(0 0 22px rgba(220, 240, 255, 0.65)) drop-shadow(0 0 50px rgba(98, 233, 255, 0.35));
}

:root[data-theme="dark"] {
  --sky-top:          #0e2736;
  --sky-base:         #091a24;
  --sky-bottom:       #06131c;

  --text-main:        #ecf6fa;
  --text-muted:       #9fc5d8;

  /* Nav Cloud Tokens (Dark Theme) */
  --nav-cloud-fill-top:       rgba(240, 248, 255, 0.95);
  --nav-cloud-fill-mid:       rgba(215, 235, 250, 0.88);
  --nav-cloud-fill-bottom:    rgba(180, 215, 240, 0.82);
  --nav-cloud-stroke:         rgba(255, 255, 255, 0.65);
  --nav-cloud-shadow:         drop-shadow(0 10px 24px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 14px rgba(98, 233, 255, 0.18));
  --nav-cloud-hover-shadow:   drop-shadow(0 14px 28px rgba(0, 0, 0, 0.65)) drop-shadow(0 0 20px rgba(98, 233, 255, 0.28));
  --nav-cloud-focus-stroke:   #52d8ee;
  --nav-cloud-focus-shadow:   drop-shadow(0 0 16px rgba(82, 216, 238, 0.85)) drop-shadow(0 12px 24px rgba(0, 0, 0, 0.6));
  --nav-cloud-active-dot:     #52d8ee;
  --nav-text:                 #061824;
}

body {
  margin: 0;
  font-family: var(--font-body);
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-base) 45%, var(--sky-bottom) 100%);
  min-height: 100vh;
  color: var(--text-main);
  overflow-x: hidden;
  position: relative;
}

/* ── CELESTIAL SUN & MOON (TOP LEFT) ────────────────────────────── */
.celestial-container {
  position: var(--celestial-position, absolute);
  top: clamp(-45px, -3.5vw, -15px);
  left: clamp(-45px, -3.5vw, -15px);
  width: clamp(140px, 16vw, 210px);
  height: clamp(140px, 16vw, 210px);
  pointer-events: none;
  z-index: 2; /* In front of sky, behind navbar (z: 100) */
  user-select: none;
}

.celestial-body {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity var(--celestial-swap-duration) cubic-bezier(0.4, 0, 0.2, 1),
              transform var(--celestial-swap-duration) cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform, opacity;
}

.celestial-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.celestial-sun {
  opacity: 1;
  transform: translate(0, 0) rotate(0deg);
  filter: var(--sun-glow);
}

.celestial-sun .sun-img {
  animation: sunGentlePulse 12s ease-in-out infinite alternate;
}

@keyframes sunGentlePulse {
  0%   { transform: scale(1) rotate(0deg); }
  50%  { transform: scale(1.025) rotate(4deg); }
  100% { transform: scale(0.99) rotate(-3deg); }
}

.celestial-moon {
  opacity: 0;
  transform: translateY(60px) rotate(20deg) scale(0.85);
  pointer-events: none;
  filter: var(--moon-glow);
}

.celestial-moon .moon-img {
  animation: moonGentleFloat 12s ease-in-out infinite alternate;
}

@keyframes moonGentleFloat {
  0%   { transform: translate(0, 0); }
  100% { transform: translate(4px, -6px); }
}

:root[data-theme="dark"] .celestial-sun {
  opacity: 0;
  transform: translateY(60px) rotate(-25deg) scale(0.85);
  pointer-events: none;
}

:root[data-theme="dark"] .celestial-moon {
  opacity: 1;
  transform: translate(0, 0) rotate(0deg) scale(1);
  pointer-events: auto;
}

/* ── STICKY NAVBAR WITH INDIVIDUAL CLOUDS ────────────────────────── */
.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: transparent;
  border-bottom: none;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  padding: 12px 0 10px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, transparent 100%);
}

:root[data-theme="dark"] .site-header {
  background: linear-gradient(180deg, rgba(6, 19, 28, 0.25) 0%, transparent 100%);
}

.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.nav-cloud-link {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 0 24px;
  text-decoration: none;
  color: var(--nav-text);
  font-family: var(--font-body);
  font-size: 0.96rem;
  font-weight: 600;
  cursor: pointer;
  background: transparent;
  border: none;
  outline: none;
  box-sizing: border-box;
  transition: transform 0.22s cubic-bezier(0.2, 0, 0, 1);
  will-change: transform;
}

.nav-cloud-link:hover {
  transform: scale(1.05) translateY(-2px);
}

.nav-cloud-link:active {
  transform: scale(0.97) translateY(0);
}

.nav-cloud-bg {
  position: absolute;
  top: -8px;
  left: -8px;
  right: -8px;
  bottom: -6px;
  pointer-events: none;
  filter: var(--nav-cloud-shadow);
  transition: filter 0.25s ease;
  z-index: 1;
}

.nav-cloud-link:hover .nav-cloud-bg {
  filter: var(--nav-cloud-hover-shadow);
}

.nav-cloud-svg {
  width: 100%;
  height: 100%;
  display: block;
}

.nav-cloud-path {
  stroke: var(--nav-cloud-stroke);
  stroke-width: 1.2;
  vector-effect: non-scaling-stroke;
  transition: stroke 0.25s ease, stroke-width 0.25s ease;
}

.nav-cloud-link:focus-visible .nav-cloud-bg {
  filter: var(--nav-cloud-focus-shadow);
}

.nav-cloud-link:focus-visible .nav-cloud-path {
  stroke: var(--nav-cloud-focus-stroke) !important;
  stroke-width: 3px !important;
}

.nav-cloud-text {
  position: relative;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  line-height: 1;
  transform: translateY(1.5px);
}

.nav-cloud-link.active .nav-cloud-text::after {
  content: "";
  display: block;
  position: absolute;
  bottom: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--nav-cloud-active-dot);
  box-shadow: 0 0 8px var(--nav-cloud-active-dot);
}

.nav-cloud-link.active .nav-cloud-path {
  stroke: var(--nav-cloud-active-dot);
  stroke-width: 1.8;
}

.nav-brand-cloud {
  min-height: 58px;
  padding: 0 22px;
}

.nav-brand-cloud .nav-cloud-bg {
  top: -10px;
  bottom: -8px;
  left: -10px;
  right: -10px;
}

.brand-logo-img {
  position: relative;
  z-index: 2;
  height: 44px;
  width: auto;
  display: block;
  object-fit: contain;
  transform: translateY(1px);
}

.header-nav {
  display: flex;
  align-items: center;
  gap: 14px;
}

.nav-theme-cloud {
  min-height: 48px;
  padding: 0 24px;
}

.hero-preview {
  padding: 60px 24px;
  text-align: center;
  max-width: 800px;
  margin: 0 auto;
}
.hero-title {
  font-family: var(--font-display);
  font-size: 3.5rem;
  font-weight: 700;
  margin: 0 0 20px;
}
.search-label {
  font-size: 0.85rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 24px;
  display: block;
  text-align: left;
}
</style>
</head>
