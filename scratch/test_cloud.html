<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --sky-cloud-shadow: rgba(8, 48, 72, 0.16);
  --search-cloud-fill-top: #ffffff;
  --search-cloud-fill-mid: #f3f9fd;
  --search-cloud-fill-bottom: #dbebf8;
  --search-cloud-stroke: rgba(255, 255, 255, 0.95);
  --search-cloud-shadow: drop-shadow(0 18px 36px rgba(8, 48, 72, 0.16)) drop-shadow(0 4px 12px rgba(8, 48, 72, 0.08));
  --search-cloud-focus-stroke: #0284c7;
  --search-cloud-focus-shadow: drop-shadow(0 0 16px rgba(2, 132, 199, 0.55)) drop-shadow(0 18px 36px rgba(8, 48, 72, 0.24));
  --search-icon-color: #436f88;
  --search-input-text: #082032;
  --search-placeholder: #587c92;
  --search-btn-bg: #09131a;
  --search-btn-text: #ffffff;
}

[data-theme="dark"] {
  --search-cloud-fill-top: rgba(240, 248, 255, 0.95);
  --search-cloud-fill-mid: rgba(215, 235, 250, 0.88);
  --search-cloud-fill-bottom: rgba(180, 215, 240, 0.82);
  --search-cloud-stroke: rgba(255, 255, 255, 0.6);
  --search-cloud-shadow: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 25px rgba(98, 233, 255, 0.25));
  --search-cloud-focus-stroke: #52d8ee;
  --search-cloud-focus-shadow: drop-shadow(0 0 20px rgba(82, 216, 238, 0.8)) drop-shadow(0 18px 40px rgba(0, 0, 0, 0.7));
  --search-icon-color: #244b60;
  --search-input-text: #061824;
  --search-placeholder: #395c70;
  --search-btn-bg: #091620;
  --search-btn-text: #62e9ff;
}

body {
  margin: 0;
  padding: 60px 20px;
  background: linear-gradient(180deg, #5ecbf8 0%, #38bdf8 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body.dark-bg {
  background: linear-gradient(180deg, #0e2736 0%, #091a24 100%);
}

.search-cloud-container {
  position: relative;
  width: 100%;
  max-width: 740px;
  min-height: 94px;
  display: flex;
  align-items: center;
  transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
  animation: searchCloudFloat 18s ease-in-out infinite alternate;
}

.search-cloud-container:hover {
  transform: scale(1.018);
}

@keyframes searchCloudFloat {
  0%   { transform: translateY(0); }
  100% { transform: translateY(-3.5px); }
}

.search-cloud-bg {
  position: absolute;
  top: -16px;
  left: -8px;
  right: -8px;
  bottom: -10px;
  pointer-events: none;
  filter: var(--search-cloud-shadow);
  transition: filter 0.25s ease;
}

.search-cloud-path {
  fill: url(#cloudGrad);
  stroke: var(--search-cloud-stroke);
  stroke-width: 1.5;
  vector-effect: non-scaling-stroke;
  transition: stroke 0.25s ease, stroke-width 0.25s ease;
}

.search-cloud-container:focus-within .search-cloud-bg {
  filter: var(--search-cloud-focus-shadow);
}

.search-cloud-container:focus-within .search-cloud-path {
  stroke: var(--search-cloud-focus-stroke);
  stroke-width: 3.5;
}

.search-cloud-svg {
  width: 100%;
  height: 100%;
  display: block;
  overflow: visible;
}

.search-box-wrapper {
  position: relative;
  z-index: 2;
  width: 100%;
  display: flex;
  align-items: center;
  /* Safe area: clear top bumps and curved end lobes */
  padding: 16px 32px 14px 34px;
  box-sizing: border-box;
}

.search-icon {
  width: 22px;
  height: 22px;
  color: var(--search-icon-color);
  margin-right: 14px;
  flex-shrink: 0;
  transition: color 0.25s ease;
}

input {
  flex: 1;
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 1.15rem;
  font-weight: 500;
  color: var(--search-input-text);
  outline: none;
  min-width: 0;
}

input::placeholder {
  color: var(--search-placeholder);
  opacity: 0.95;
}

button {
  background: var(--search-btn-bg);
  color: var(--search-btn-text);
  border: none;
  padding: 13px 30px;
  border-radius: 9999px;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.22);
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  flex-shrink: 0;
}

button:hover {
  transform: translateY(-1.5px);
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.32);
}
</style>
</head>
<body>
  <div class="search-cloud-container">
    <div class="search-cloud-bg" aria-hidden="true">
      <svg class="search-cloud-svg" viewBox="0 0 780 130" preserveAspectRatio="none" focusable="false">
        <defs>
          <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="var(--search-cloud-fill-top)"/>
            <stop offset="55%" stop-color="var(--search-cloud-fill-mid)"/>
            <stop offset="100%" stop-color="var(--search-cloud-fill-bottom)"/>
          </linearGradient>
        </defs>
        <!-- Fluffy horizontal cloud path with distinctive organic puffs -->
        <path class="search-cloud-path"
              d="M 60 55
                 C 34 38, 14 55, 14 78
                 C 14 98, 30 114, 55 115
                 C 120 120, 200 117, 260 114
                 C 325 120, 455 122, 535 115
                 C 605 120, 685 119, 725 114
                 C 752 110, 768 95, 768 76
                 C 768 54, 750 36, 726 44
                 C 708 20, 665 12, 624 24
                 C 592 8, 536 4, 492 18
                 C 450 -4, 355 -3, 305 16
                 C 265 4, 195 8, 155 24
                 C 122 10, 74 18, 60 55 Z" />
      </svg>
    </div>
    <div class="search-box-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search" placeholder="Something you're curious about…" value="" />
      <button type="button">Search</button>
    </div>
  </div>
</body>
</html>
